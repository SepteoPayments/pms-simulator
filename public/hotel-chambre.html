<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chambre — Hôtel Le Rivage</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="styles.css" /><link rel="stylesheet" href="ui.css" /><link rel="stylesheet" href="skins.css" />
<link rel="stylesheet" href="https://checkoutshopper-test.adyen.com/checkoutshopper/sdk/5.68.0/adyen.css" />
<script src="https://checkoutshopper-test.adyen.com/checkoutshopper/sdk/5.68.0/adyen.js"></script>
<style>
  .view-band { display: flex; gap: 14px; align-items: center; background: linear-gradient(90deg, #14324f, #294b68); color: #fff; border-radius: 8px; padding: 16px 20px; }
  .view-band .vb-ico { font-size: 30px; }
  .view-band b { font-family: var(--font-head); font-size: 20px; display: block; }
  .view-band span { font-size: 13px; opacity: .85; }
  .other-rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .other-rooms a { display: block; text-decoration: none; color: inherit; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); transition: transform .15s, box-shadow .15s; }
  .other-rooms a:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
  .other-rooms img { width: 100%; aspect-ratio: 16/10; object-fit: cover; }
  .other-rooms .o-b { padding: 10px 12px; }
  .other-rooms .o-b b { font-family: var(--font-head); font-size: 17px; display: block; }
  .other-rooms .o-b span { font-size: 12.5px; color: var(--muted); }
  .guests-pick { display: flex; gap: 8px; }
  .guests-pick button { flex: 1; border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 8px 4px; font: inherit; font-size: 13px; cursor: pointer; }
  .guests-pick button.on { border-color: var(--accent); background: #f3e9dc; font-weight: 600; }
  .mode-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--bg); padding: 4px; border-radius: 6px; margin: 12px 0 4px; }
  .mode-switch button { border: none; background: transparent; font: inherit; font-size: 12.5px; padding: 8px; border-radius: 4px; cursor: pointer; color: var(--muted); font-weight: 500; }
  .mode-switch button.on { background: var(--surface); color: var(--brand); font-weight: 600; box-shadow: var(--shadow-sm); }
</style>
</head>
<body class="theme-hotel" data-theme-key="hotel">
  <header class="topbar dark">
    <div class="wrap">
      <a class="brand" href="hotel.html"><span class="dot">R</span><span>Hôtel Le Rivage<small>Cassis · ★★★★ · Asterio by Septeo</small></span></a>
      <nav class="nav">
        <a href="hotel.html#chambres">Chambres</a>
        <a href="hotel.html#services">Services</a>
        <a class="cta" href="operations.html">Console d'opérations</a>
      </nav>
    </div>
  </header>

  <main class="wrap" id="root"></main>

  <footer class="footer"><div class="wrap"><span>Hôtel Le Rivage · 12 quai des Baux, 13260 Cassis · démo sandbox</span><span>PMS Asterio · Ulyses — Septeo Hospitality</span></div></footer>

  <script src="themes.js"></script>
  <script src="theme-switcher.js"></script>
  <script src="common.js"></script>
  <script src="checkout.js"></script>
  <script src="site.js"></script>
  <script src="data/hotel.js"></script>
  <script>
    (function () {
      var D = window.DATA_HOTEL, S = window.SITE, root = document.getElementById('root');
      var id = S.qs('id') || 'superieure';
      var R = D.rooms.filter(function (r) { return r.id === id; })[0];
      if (!R) { root.innerHTML = '<div class="empty-state" style="margin:60px 0"><div class="e-ico">🛎️</div><h2>Chambre introuvable</h2><p>Cette chambre n’existe pas (ou plus). <a href="hotel.html#chambres">Retour aux chambres</a></p></div>'; return; }
      document.title = R.name + ' — Hôtel Le Rivage';

      // état
      var d0 = new Date(); var toFri = (5 - d0.getDay() + 7) % 7 || 7;
      var st = { in: S.qs('in') || S.today(toFri + 7), out: S.qs('out') || null, guests: Math.min(R.capacity, Number(S.qs('guests')) || 2), opts: {}, mode: 'caution' };
      if (!st.out) st.out = S.addDays(st.in, 2);
      function isWeekend(iso) { var d = new Date(iso + 'T12:00:00').getDay(); return d === 5 || d === 6; }
      function nightPrice(iso) { return R.night + (isWeekend(iso) ? R.weekendPlus : 0); }
      // disponibilités pseudo-aléatoires mais stables par chambre
      var booked = []; var seed = R.id.length * 37; for (var k = 1; k < 120; k++) { if (S.rand(seed + k) < 0.16) booked.push(S.today(k)); }
      var bookedSet = {}; booked.forEach(function (b) { bookedSet[b] = 1; });
      // évite que la période par défaut chevauche une date réservée
      for (var c = st.in; c < st.out; c = S.addDays(c, 1)) if (bookedSet[c]) { st.in = S.addDays(st.out, 2); st.out = S.addDays(st.in, 2); break; }

      var photos = R.photos.map(function (p) { return { src: p[0], alt: p[1] }; });
      var avg = R.reviews.reduce(function (s, r) { return s + r.rating; }, 0) / R.reviews.length;

      root.innerHTML =
        '<nav class="crumbs"><a href="index.html">Univers</a><span class="sep">›</span><a href="hotel.html">Hôtel Le Rivage</a><span class="sep">›</span><a href="hotel.html#chambres">Chambres</a><span class="sep">›</span><b>' + S.esc(R.name) + '</b></nav>' +
        '<div class="fiche-head"><div><span class="eyebrow">' + S.esc(R.badge) + ' · ' + S.esc(R.floor) + '</span><h1>' + S.esc(R.name) + '</h1>' +
          '<div class="sub">' + S.stars(R.rating, R.reviewsCount) + '<span class="dot-sep">' + S.esc(R.view) + '</span><span class="dot-sep">' + R.size + ' m²</span><span class="dot-sep">jusqu’à ' + R.capacity + ' pers.</span></div></div>' +
          '<div class="aside"><div class="from">à partir de</div><div class="price-big">' + S.euros(R.night) + ' <small>/ nuit</small></div></div></div>' +
        '<div class="fiche-grid">' +
          '<div class="fiche-main">' +
            '<div id="gallery"></div>' +
            '<div class="view-band" data-reveal><span class="vb-ico">' + (R.id === 'classique' || R.id === 'famille' ? '🌿' : '🌅') + '</span><div><b>' + S.esc(R.view) + '</b><span>' + S.esc(R.exposure) + ' · ' + S.esc(R.floor) + '</span></div></div>' +
            '<section data-reveal><h2>La chambre</h2><div class="prose"><p>' + S.esc(R.desc) + '</p><p><em>' + S.esc(R.tagline) + '.</em> Literie hôtelière 30 cm, linge en percale 400 fils, produits d’accueil bio de Provence. Ménage quotidien et service de couverture le soir.</p></div></section>' +
            '<section data-reveal><h2>En un coup d’œil</h2><div class="specs">' +
              '<div class="spec"><span class="s-ico">📐</span><div><div class="s-lab">Superficie</div><div class="s-val">' + R.size + ' m²</div></div></div>' +
              '<div class="spec"><span class="s-ico">👥</span><div><div class="s-lab">Capacité</div><div class="s-val">' + R.capacity + ' personnes</div></div></div>' +
              '<div class="spec"><span class="s-ico">🛏️</span><div><div class="s-lab">Literie</div><div class="s-val">' + S.esc(R.beds) + '</div></div></div>' +
              '<div class="spec"><span class="s-ico">🧭</span><div><div class="s-lab">Exposition</div><div class="s-val">' + S.esc(R.exposure.split(' · ')[0]) + '</div></div></div>' +
              '<div class="spec"><span class="s-ico">🏢</span><div><div class="s-lab">Étage</div><div class="s-val">' + S.esc(R.floor) + '</div></div></div>' +
              '<div class="spec"><span class="s-ico">🕒</span><div><div class="s-lab">Arrivée / départ</div><div class="s-val">' + D.hotel.checkin + ' / ' + D.hotel.checkout + '</div></div></div>' +
            '</div></section>' +
            '<section data-reveal><h2>Équipements</h2><ul class="amen">' + R.amenities.map(function (a) { var l = D.amenityLabels[a]; return '<li><span class="a-ico">' + l[0] + '</span>' + S.esc(l[1]) + '</li>'; }).join('') + '</ul></section>' +
            '<section data-reveal><h2>Les petits plus</h2><ul class="perks">' + R.perks.map(function (p) { return '<li>' + S.esc(p) + '</li>'; }).join('') + '</ul></section>' +
            '<section data-reveal><h2>Disponibilités & tarifs</h2><p class="hint" style="margin:0 0 10px">Sélectionnez votre arrivée puis votre départ. Les nuits de vendredi et samedi sont majorées de ' + S.euros(R.weekendPlus) + '.</p><div id="cal"></div></section>' +
            '<section data-reveal><h2>Personnalisez votre séjour</h2><div class="options" id="opts"></div></section>' +
            '<section data-reveal><h2>Avis des voyageurs</h2>' +
              '<div class="rating-sum"><div class="big">' + R.rating.toFixed(1) + '</div><div><div>' + S.stars(R.rating) + '</div><div class="hint">' + R.reviewsCount + ' avis vérifiés · séjours ' + new Date().getFullYear() + '</div></div>' +
              '<div class="rating-bars"><div>Propreté<i style="--w:96%"></i><span>4.8</span></div><div>Confort<i style="--w:94%"></i><span>4.7</span></div><div>Emplacement<i style="--w:98%"></i><span>4.9</span></div><div>Rapport qualité/prix<i style="--w:86%"></i><span>4.3</span></div></div></div>' +
              '<div class="reviews">' + R.reviews.map(function (r) { return '<div class="review"><div class="r-head"><span class="avatar">' + S.esc(r.who[0]) + '</span><div><div class="r-who">' + S.esc(r.who) + '</div><div class="r-meta">' + S.esc(r.from) + ' · ' + S.esc(r.date) + '</div></div><span style="margin-left:auto">' + S.stars(r.rating) + '</span></div><p class="r-txt">' + S.esc(r.text) + '</p><span class="r-tag">' + S.esc(r.tag) + '</span></div>'; }).join('') + '</div></section>' +
            '<section data-reveal><h2>Nos autres chambres</h2><div class="other-rooms">' + D.rooms.filter(function (r) { return r.id !== R.id; }).map(function (r) { return '<a href="hotel-chambre.html?id=' + r.id + '&in=' + st.in + '&out=' + st.out + '&guests=' + st.guests + '"><img src="' + r.photos[0][0] + '" alt="" loading="lazy"><div class="o-b"><b>' + S.esc(r.name) + '</b><span>' + r.size + ' m² · dès ' + S.euros(r.night) + '/nuit</span></div></a>'; }).join('') + '</div></section>' +
          '</div>' +
          '<aside class="book-card" id="book"></aside>' +
        '</div>';

      S.gallery('#gallery', photos);
      var cal = S.calendar('#cal', { months: 2, booked: booked, start: st.in, end: st.out, prices: nightPrice, onChange: function (a, b) { st.in = a; st.out = b; renderBook(); } });

      document.getElementById('opts').innerHTML = D.options.map(function (o) {
        return '<label class="option" data-o="' + o.id + '"><input type="checkbox"><span class="o-ico">' + o.ico + '</span><div class="o-main"><div class="o-name">' + S.esc(o.name) + '</div><div class="o-desc">' + S.esc(o.desc) + '</div></div><div class="o-price">' + S.euros(o.price) + ' <small>/ ' + S.esc(o.per) + '</small></div></label>';
      }).join('');
      document.querySelectorAll('.option input').forEach(function (cb) { cb.addEventListener('change', function () { var id = cb.closest('.option').getAttribute('data-o'); st.opts[id] = cb.checked; cb.closest('.option').classList.toggle('on', cb.checked); renderBook(); }); });

      function optAmount(o, n, g) { if (o.per === 'pers./nuit') return o.price * n * g; if (o.per === 'pers./séjour') return o.price * g; if (o.per === 'nuit') return o.price * n; return o.price; }
      function breakdown() {
        var n = st.out ? S.nights(st.in, st.out) : 0, lines = [], stay = 0;
        for (var c = st.in; n && c < st.out; c = S.addDays(c, 1)) stay += nightPrice(c);
        if (n) lines.push(['Hébergement · ' + n + ' nuit' + (n > 1 ? 's' : ''), stay]);
        var taxe = D.taxeSejour * st.guests * n; if (n) lines.push(['Taxe de séjour · ' + st.guests + ' pers.', taxe]);
        D.options.forEach(function (o) { if (st.opts[o.id]) lines.push([o.name, optAmount(o, n, st.guests)]); });
        var total = lines.reduce(function (s, l) { return s + l[1]; }, 0);
        return { n: n, lines: lines, total: total, deposit: n ? nightPrice(st.in) : R.night };
      }
      function renderBook() {
        var b = breakdown(), box = document.getElementById('book');
        box.innerHTML =
          '<div class="bc-price"><b>' + S.euros(R.night) + '</b><span>/ nuit · hors week-end</span></div>' +
          '<div class="bc-rating">' + S.stars(R.rating) + '<span>' + R.rating.toFixed(1) + ' (' + R.reviewsCount + ')</span></div>' +
          '<div class="field-row"><label>Arrivée<input type="date" id="b-in" value="' + st.in + '"></label><label>Départ<input type="date" id="b-out" value="' + (st.out || '') + '"></label></div>' +
          '<div class="hint" style="margin-bottom:6px">Voyageurs (max ' + R.capacity + ')</div><div class="guests-pick" id="gp">' + [1, 2, 3, 4].filter(function (g) { return g <= R.capacity; }).map(function (g) { return '<button type="button" data-g="' + g + '" class="' + (g === st.guests ? 'on' : '') + '">' + g + ' pers.</button>'; }).join('') + '</div>' +
          (b.n ? b.lines.map(function (l) { return '<div class="bc-row"><span class="lab">' + S.esc(l[0]) + '</span><span class="val">' + S.euros(l[1]) + '</span></div>'; }).join('') : '<div class="bc-row"><span class="lab">Choisissez une date de départ dans le calendrier</span></div>') +
          '<div class="bc-total"><span>Total séjour<small>Réglé au départ, extras inclus</small></span><span>' + S.euros(b.total) + '</span></div>' +
          '<div class="mode-switch"><button type="button" data-m="caution" class="' + (st.mode === 'caution' ? 'on' : '') + '">Réserver (garantie)</button><button type="button" data-m="immediate" class="' + (st.mode === 'immediate' ? 'on' : '') + '">Prépayer le séjour</button></div>' +
          '<div class="actions">' +
            (st.mode === 'caution'
              ? '<button class="btn accent" id="go" ' + (b.n ? '' : 'disabled') + '>Réserver — empreinte ' + S.euros(b.deposit) + '</button>'
              : '<button class="btn" id="go" ' + (b.n ? '' : 'disabled') + '>Prépayer — ' + S.euros(b.total) + '</button>') +
          '</div>' +
          '<div class="how">' + (st.mode === 'caution'
            ? '<b>Pré-autorisation d’une nuit.</b> Rien n’est débité : l’empreinte garantit la chambre et couvre un no-show. La note complète (' + S.euros(b.total) + ') sera capturée à votre départ.'
            : '<b>Paiement immédiat.</b> Le séjour et les options sont capturés maintenant. Les extras consommés sur place s’ajouteront à votre note au départ.') + '</div>' +
          '<div class="pbs-slot" data-pbs="compact"></div>';
        S.brand();
        document.getElementById('b-in').onchange = function () { st.in = this.value; if (st.out && st.out <= st.in) st.out = S.addDays(st.in, 1); cal.set(st.in, st.out); renderBook(); };
        document.getElementById('b-out').onchange = function () { st.out = this.value; if (st.out <= st.in) st.out = S.addDays(st.in, 1); cal.set(st.in, st.out); renderBook(); };
        box.querySelectorAll('#gp button').forEach(function (bt) { bt.onclick = function () { st.guests = Number(bt.getAttribute('data-g')); renderBook(); }; });
        box.querySelectorAll('.mode-switch button').forEach(function (bt) { bt.onclick = function () { st.mode = bt.getAttribute('data-m'); renderBook(); }; });
        var go = document.getElementById('go');
        if (go) go.onclick = function () {
          var summary = [['Chambre', R.name], ['Séjour', S.fmtDate(st.in) + ' → ' + S.fmtDate(st.out) + ' (' + b.n + ' nuit' + (b.n > 1 ? 's' : '') + ')'], ['Voyageurs', String(st.guests)]].concat(b.lines.map(function (l) { return [l[0], S.euros(l[1])]; }));
          var prefill = { checkIn: st.in, checkOut: st.out, guests: String(st.guests), room: R.name };
          if (st.mode === 'caution') {
            summary.push(['Empreinte pré-autorisée', S.euros(b.deposit)], ['Note estimée au départ', S.euros(b.total)]);
            PMS.checkout({ mode: 'caution', amount: b.deposit, itemLabel: 'Garantie réservation — ' + R.name, summary: summary, prefill: prefill });
          } else {
            PMS.checkout({ mode: 'immediate', amount: b.total, itemLabel: 'Séjour prépayé — ' + R.name, summary: summary, prefill: prefill });
          }
        };
      }
      renderBook();
      S.reveal();
    })();
  </script>
</body>
</html>
